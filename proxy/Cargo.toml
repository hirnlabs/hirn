[package]
name = "hirn-proxy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hirn-proxy"
path = "src/main.rs"

[lib]
name = "hirn_proxy"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
ureq = "2.12"
flate2 = "1"
tar = "0.4"
dirs = "5.0"

[dev-dependencies]
tempfile = "3"
