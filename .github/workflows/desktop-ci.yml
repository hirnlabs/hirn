name: Release Hirn Desktop & Web Client

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-desktop:
    name: Build Desktop - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: macos-x64
            os: macos-latest
          - platform: windows-x64
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bun Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('desktop/bun.lock', 'desktop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.platform }}

      - name: Install Frontend Dependencies
        working-directory: desktop
        run: bun install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hirn-desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 1

  build-web-docker:
    name: Build Web Client Docker Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./desktop
          file: ./desktop/Dockerfile
          push: false
          tags: ghcr.io/hirnlabs/desktop-web:latest

  create-release:
    name: Create Draft Release
    needs: [build-desktop, build-web-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: hirn-desktop-*
          merge-multiple: true

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat << 'EOF' > release_body.md
          ## Hirn Desktop & Web Release

          This release contains pre-built installers for **Hirn Desktop** (Linux, macOS, Windows) and Docker web container deployment.

          ### Desktop Installation & Update Instructions

          #### Linux and macOS
          Run the automated setup script to download and install or update:
          ```bash
          curl -fsSL https://raw.githubusercontent.com/hirnlabs/hirn/main/desktop/setup/install.sh | bash
          ```

          #### Windows (PowerShell)
          Run the PowerShell installer to download and install or update:
          ```powershell
          irm https://raw.githubusercontent.com/hirnlabs/hirn/main/desktop/setup/install.ps1 | iex
          ```

          ### Web Client Docker Deployment
          ```bash
          docker run -d -p 80:80 ghcr.io/hirnlabs/desktop-web:latest
          ```

          ### Direct Downloads
          - **Windows**: `.msi` or `.exe` installer below.
          - **macOS**: `.dmg` disk image below.
          - **Linux**: `.AppImage` or `.deb` package below.
          EOF

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release_body.md
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
